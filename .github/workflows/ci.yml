name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # 时区相关的测试在 UTC 下验证不出问题，所以用一个非 UTC 时区运行
        # TODO：以后改成 matrix，再加 America/Toronto（UTC 以西且有夏令时）和 UTC
        env:
          TZ: Asia/Shanghai
        run: flutter test
